spring.threads.virtual.enabled=true

# --- COOL LOGGING CONFIG ---
# This pattern highlights the thread name in brackets [ ] and uses colors if supported
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){magenta} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n
